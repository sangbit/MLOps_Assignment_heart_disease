# CI pipeline: lint -> unit tests -> model training (quality gate) -> Docker image build, test, publish.
# Runs on every push and pull request to main, and can be started by hand from the Actions tab.
# Each job saves its outputs as downloadable artifacts, kept for 30 days.

name: CI - lint, test, train, build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:          # adds a "Run workflow" button on GitHub

env:
  PYTHON_VERSION: "3.13"
  MLFLOW_DISABLE_AGENT_HINT: "1"

jobs:
  # ------------------------------------------------------------------ 1. Lint
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff==0.17.1

      - name: Run ruff
        run: |
          mkdir -p reports
          # human-readable report saved as an artifact
          ruff check . --output-format=full --no-fix | tee reports/lint-report.txt
          # GitHub annotations: problems shown directly on the changed lines
          ruff check . --output-format=github --no-fix

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: reports/lint-report.txt
          retention-days: 30

  # ------------------------------------------------------------------ 2. Unit tests
  test:
    name: Unit tests (pytest)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-test.txt

      - name: Run tests with coverage
        run: |
          mkdir -p reports
          pytest \
            --junitxml=reports/junit.xml \
            --cov=src --cov-report=term-missing \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=html:reports/coverage-html \
            | tee reports/pytest-output.txt

      - name: Add test summary to the run page
        if: always()
        run: |
          {
            echo "## Unit tests"
            echo '```'
            tail -n 25 reports/pytest-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: reports/
          retention-days: 30

  # ------------------------------------------------------------------ 3. Train
  train:
    name: Train model + quality gate
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train model
        # fails the job (and the pipeline) if the quality gate in params.yaml is not met
        run: |
          mkdir -p logs
          python -m src.train 2>&1 | tee logs/train.log

      - name: Smoke-test the saved model
        run: python -m src.predict examples/sample_patients.json | tee -a logs/train.log

      - name: Upload trained model
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trained-model-${{ github.sha }}
          path: |
            models/
            params.yaml
            logs/train.log
          retention-days: 30

      - name: Upload MLflow tracking data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mlflow-run-${{ github.sha }}
          path: |
            mlflow.db
            mlruns/
          retention-days: 30
          if-no-files-found: ignore

  # ------------------------------------------------------------------ 4. Docker image
  # Connects CI to deployment: packages the model that just passed the quality gate into the
  # API image, smoke-tests the running container, and publishes it to GitHub Container Registry.
  docker:
    name: Build, test & publish image
    needs: train
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # allows pushing to ghcr.io
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/heart-disease-api
    steps:
      - uses: actions/checkout@v6

      - name: Use the model trained in this run
        uses: actions/download-artifact@v8
        with:
          name: trained-model-${{ github.sha }}
          path: .

      - name: Image tags
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v4      # lets the runner build ARM images too
      - uses: docker/setup-buildx-action@v4

      - name: Build image for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: heart-disease-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container and smoke-test it
        run: |
          docker run -d -p 8000:8000 --name api heart-disease-api:ci
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 1
          done
          bash scripts/smoke_test.sh http://127.0.0.1:8000
          docker logs api
          docker rm -f api

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (Intel + Apple Silicon)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ env.SHORT_SHA }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha

      - name: Add image details to the run page
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          {
            echo "## Docker image published"
            echo "| Tag | Pull command |"
            echo "|---|---|"
            echo "| \`sha-${SHORT_SHA}\` | \`docker pull ${IMAGE}:sha-${SHORT_SHA}\` |"
            echo "| \`latest\` | \`docker pull ${IMAGE}:latest\` |"
            echo ""
            echo "Deploy this exact version:"
            echo "\`helm upgrade --install heart-api helm/heart-disease-api -n heart-disease --set image.tag=sha-${SHORT_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
